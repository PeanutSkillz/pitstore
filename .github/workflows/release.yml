# SPDX-License-Identifier: LGPL-2.1-or-later
#
# A signed tag vX.Y.Z publishes a release: the .deb, a CycloneDX SBOM and
# signed checksums on GitHub Releases, and the signed APT repository on
# GitHub Pages. Secrets: PITSTORE_SIGNING_KEY (armored private key) and
# PITSTORE_SIGNING_PASSPHRASE. The public key is .github/pitstore.asc.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must be signed with the release key
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --no-tags --force origin "refs/tags/${tag}:refs/tags/${tag}"
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import .github/pitstore.asc
          git verify-tag "${tag}"
      - name: The tag must match the package version
        run: |
          version="$(sed -n '1s/^pitstore (\([^)]*\)).*/\1/p' debian/changelog)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "$(node -p 'require("./package.json").version')" = "${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Fetch pinned Cockpit pkg/lib
        run: make pkg/lib/cockpit-po-plugin.js
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Checks
        run: |
          npm run eslint
          npm run typecheck
          npm test
          npm run test:helper
          npm audit --audit-level=high
      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper lintian
      - name: Build .deb and run lintian
        run: make deb
      - name: Collect release files
        run: |
          mkdir -p out
          mv ../pitstore_*_all.deb out/
          # the components that end up in the package (no build tools)
          npm sbom --sbom-format cyclonedx --omit dev > "out/pitstore_${VERSION}.cdx.json"
          (cd out && sha256sum -- * > SHA256SUMS)
      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.PITSTORE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.PITSTORE_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "${SIGNING_KEY}" | gpg --batch --import
          printf '%s' "${SIGNING_PASSPHRASE}" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output out/SHA256SUMS.asc out/SHA256SUMS
          gpg --batch --import .github/pitstore.asc
          gpg --batch --verify out/SHA256SUMS.asc out/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          fingerprint="$(gpg --show-keys --with-colons .github/pitstore.asc | awk -F: '/^fpr/ {print $10; exit}')"
          {
            # this version's section of CHANGELOG.md
            awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
            echo
            echo "Release signing key fingerprint: \`${fingerprint}\`"
            echo
            echo "Verify: \`gpg --verify SHA256SUMS.asc SHA256SUMS && sha256sum -c SHA256SUMS\`"
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" out/* --verify-tag --title "PitStore ${version}" --notes-file notes.md

  apt:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the packages of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo/pool/main/p/pitstore
          for tag in $(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern 'pitstore_*_all.deb' --dir repo/pool/main/p/pitstore --skip-existing
          done
          ls -l repo/pool/main/p/pitstore
      - name: Build the APT repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
          cd repo
          mkdir -p dists/stable/main/binary-all dists/stable/main/binary-amd64 dists/stable/main/binary-arm64
          apt-ftparchive packages pool > dists/stable/main/binary-all/Packages
          # architecture-specific indexes list the same arch: all package
          for arch in amd64 arm64; do cp dists/stable/main/binary-all/Packages "dists/stable/main/binary-${arch}/Packages"; done
          for f in dists/stable/main/binary-*/Packages; do gzip -9kn "$f"; done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=PitStore \
            -o APT::FTPArchive::Release::Label=PitStore \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="all amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="PitStore for Cockpit" \
            release dists/stable > dists/stable/Release
          cp ../.github/pitstore.asc pitstore.asc
          printf '%s\n' 'PitStore APT repository. See the README of the project for how to use it.' > index.html
      - name: Sign the repository
        env:
          SIGNING_KEY: ${{ secrets.PITSTORE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.PITSTORE_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "${SIGNING_KEY}" | gpg --batch --import
          cd repo/dists/stable
          printf '%s' "${SIGNING_PASSPHRASE}" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --clearsign --digest-algo SHA512 --output InRelease Release
          printf '%s' "${SIGNING_PASSPHRASE}" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --digest-algo SHA512 --output Release.gpg Release
      - name: Check the repository with apt
        run: |
          root="$(mktemp -d)"
          mkdir -p "${root}/etc/apt/sources.list.d" "${root}/etc/apt/preferences.d" "${root}/etc/apt/apt.conf.d" "${root}/var/lib/apt/lists/partial" "${root}/var/cache/apt/archives/partial"
          echo "deb [signed-by=${PWD}/.github/pitstore.asc] file://${PWD}/repo stable main" > "${root}/etc/apt/sources.list.d/pitstore.list"
          apt-get -o Dir="${root}" -o Dir::State::status=/var/lib/dpkg/status update
          apt-cache -o Dir="${root}" -o Dir::State::status=/var/lib/dpkg/status policy pitstore | grep -q Candidate
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
