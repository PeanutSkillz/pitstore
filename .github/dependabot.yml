version: 2
updates:
  # Monthly, and only patch/minor releases. Major releases need their own
  # work and testing. PatternFly only gets patch releases: its packages must
  # stay on one minor version together (mixed versions broke the layout), so
  # minor updates are done by hand and tested in a VM. These rules do not
  # hold back security updates (Dependabot alerts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      patternfly:
        patterns: ["@patternfly/*"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
      stylelint:
        patterns: ["stylelint*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
