version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patternfly:
        patterns: ["@patternfly/*"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
      stylelint:
        patterns: ["stylelint*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
