name: Feature request
description: Suggest an improvement to the Dashboard or Appstore
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PitStore only adds the Dashboard and Appstore pages. Features that Cockpit
        already offers (files, storage, users, networking, logs, metrics) are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this need new privileges, new mounts, or new network access?
