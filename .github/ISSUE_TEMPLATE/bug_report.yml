name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues:** do not report them here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Appstore
        2. ...
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Catalog app (if any)
      placeholder: e.g. com.icewhale.bentopdf
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `dpkg-query -W pitstore cockpit-ws cockpit-bridge podman docker.io` and `lsb_release -d`
      render: text
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Container runtime
      options:
        - Podman (rootless)
        - Podman (system)
        - Docker
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser console or error messages
      description: Remove any passwords or other secrets first.
      render: text
